name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"
  MIX_ENV: prod

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin

    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix Dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.arch }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-mix-

      - name: Get Semantic Version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Mix Dependencies
        run: mix deps.get --only prod

      - name: Build Release
        run: mix release --overwrite

      - name: Generate Checksum
        run: |
          mv \
            "_build/prod/estuary-${VERSION}.tar.gz" \
            "estuary-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"

          sha256sum \
            "estuary-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            > "estuary-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: estuary-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            estuary-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            estuary-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
